rafo`,`그래프에서 보기`,`在图谱中显示`,`グラフに表示`],"Tasks appear when an assessment starts.":[`Las tareas aparecen al iniciar una evaluación.`,`평가를 시작하면 작업이 표시됩니다.`,`评估开始后将显示任务。`,`評価を開始するとタスクが表示されます。`],"{count} model review":[`{count} revisión del modelo`,`모델 검토 {count}개`,`{count} 项模型审查`,`モデルレビュー {count} 件`],"{count} model reviews":[`{count} revisiones del modelo`,`모델 검토 {count}개`,`{count} 项模型审查`,`モデルレビュー {count} 件`],"Evidence processed":[`Evidencia procesada`,`증거 처리 완료`,`证据已处理`,`証拠を処理済み`],"No activity matches these filters.":[`Ninguna actividad coincide con estos filtros.`,`필터와 일치하는 활동이 없습니다.`,`没有符合筛选条件的活动。`,`フィルターに一致するアクティビティがありません。`],"No worker activity for this assessment.":[`No hay actividad de agentes en esta evaluación.`,`이 평가에는 작업자 활동이 없습니다.`,`此评估没有工作代理活动。`,`この評価にはワーカーのアクティビティがありません。`],"Assessment task":[`Tarea de evaluación`,`평가 작업`,`评估任务`,`評価タスク`],"Coordinator note":[`Nota del coordinador`,`코디네이터 메모`,`协调器备注`,`コーディネーターのメモ`],"Graph coverage":[`Cobertura del grafo`,`그래프 범위`,`图谱覆盖范围`,`グラフのカバレッジ`],"Evidence review":[`Revisión de evidencia`,`증거 검토`,`证据审查`,`証拠レビュー`],"Incident correlation":[`Correlación de incidentes`,`인시던트 상관 분석`,`事件关联`,`インシデントの相関分析`],"Dependency impact":[`Impacto de dependencias`,`종속성 영향`,`依赖影响`,`依存関係への影響`],"Provenance trace":[`Rastreo de procedencia`,`출처 추적`,`溯源追踪`,`来歴の追跡`],"Finding review":[`Revisión del hallazgo`,`발견 사항 검토`,`发现项审查`,`検出事項レビュー`],"Evidence validation":[`Validación de evidencia`,`증거 검증`,`证据验证`,`証拠の検証`],"Control coverage verification":[`Verificar cobertura de controles`,`통제 범위 검증`,`验证控制措施覆盖范围`,`対策のカバレッジ検証`],"Waiting for a graph snapshot":[`Esperando una instantánea del grafo`,`그래프 스냅샷 대기 중`,`等待图谱快照`,`グラフのスナップショット待ち`],"Waiting for an alert feed":[`Esperando una fuente de alertas`,`경보 피드 대기 중`,`等待告警源`,`アラートフィード待ち`],"Waiting for supporting evidence":[`Esperando evidencia de respaldo`,`뒷받침하는 증거 대기 중`,`等待佐证`,`裏付けとなる証拠待ち`],"Waiting for a prerequisite":[`Esperando un requisito previo`,`선행 작업 대기 중`,`等待前置任务`,`前提タスク待ち`],"Selected asset has not been published":[`El activo seleccionado no se ha publicado`,`선택한 자산이 게시되지 않았습니다`,`所选资产尚未发布`,`選択した資産は未公開です`],"Selected node has not been published":[`El nodo seleccionado no se ha publicado`,`선택한 노드가 게시되지 않았습니다`,`所选节点尚未发布`,`選択したノードは未公開です`],"No impact asset selected":[`No se ha seleccionado un activo para analizar su impacto`,`영향을 분석할 자산을 선택하지 않았습니다`,`未选择要分析影响的资产`,`影響を調べる資産が選択されていません`],"No trace node selected":[`No se ha seleccionado un nodo para rastrear`,`추적할 노드를 선택하지 않았습니다`,`未选择要追踪的节点`,`追跡するノードが選択されていません`],"The incident is unavailable in this evidence revision.":[`El incidente no está disponible en esta revisión.`,`이 증거 리비전에서 인시던트를 사용할 수 없습니다.`,`此证据修订版本中没有该事件。`,`この証拠リビジョンではインシデントを利用できません。`],"Some contributing alerts are missing from this saved revision.":[`Faltan alertas relacionadas en esta revisión guardada.`,`저장된 리비전에 일부 관련 경보가 없습니다.`,`此已保存的修订版本缺少部分相关告警。`,`この保存済みリビジョンには関連アラートの一部がありません。`],"Enter a case hint of up to 1,000 characters.":[`Introduzca una pista de hasta 1000 caracteres.`,`사례 힌트를 1,000자 이내로 입력하세요.`,`请输入不超过 1,000 个字符的案件提示。`,`ケースのヒントを1,000文字以内で入力してください。`],"Select a supported model output language or use the gateway default.":[`Seleccione un idioma compatible o use el predeterminado de la puerta de enlace.`,`지원되는 모델 출력 언어 또는 게이트웨이 기본값을 선택하세요.`,`请选择受支持的模型输出语言或使用网关默认设置。`,`対応するモデル出力言語かゲートウェイの既定値を選択してください。`],"Choose a worker limit between 1 and the gateway limit, or use the gateway default.":[`Elija un límite entre 1 y el máximo de la puerta de enlace, o use el valor predeterminado.`,`1과 게이트웨이 한도 사이의 작업자 수를 선택하거나 게이트웨이 기본값을 사용하세요.`,`请选择 1 到网关上限之间的工作代理数量，或使用网关默认设置。`,`1からゲートウェイの上限までのワーカー数か、既定値を選択してください。`],"Choose how to import the inventory.":[`Elija cómo importar el inventario.`,`인벤토리를 가져오는 방법을 선택하세요.`,`请选择清单导入方式。`,`インベントリのインポート方法を選択してください。`],"The inventory changed after the preview. Preview it again before importing.":[`El inventario cambió después de la vista previa. Vuelva a previsualizarlo antes de importarlo.`,`미리보기 이후 인벤토리가 변경되었습니다. 가져오기 전에 다시 미리 보세요.`,`清单在预览后已更改。请重新预览后再导入。`,`プレビュー後にインベントリが変更されました。再度プレビューしてからインポートしてください。`],"The import conflicts with the current inventory.":[`La importación es incompatible con el inventario actual.`,`가져올 데이터가 현재 인벤토리와 충돌합니다.`,`导入内容与当前清单冲突。`,`インポートデータが現在のインベントリと競合しています。`],"The imported inventory exceeds the Sentinel graph limits.":[`El inventario importado supera los límites del grafo de Sentinel.`,`가져올 인벤토리가 Sentinel 그래프 한도를 초과합니다.`,`导入的清单超出 Sentinel 图谱限制。`,`インポートするインベントリが Sentinel のグラフ上限を超えています。`],"The imported inventory exceeds the Sentinel file limit.":[`El inventario importado supera el límite de tamaño de archivo de Sentinel.`,`가져올 인벤토리가 Sentinel 파일 크기 한도를 초과합니다.`,`导入的清单超出 Sentinel 文件大小限制。`,`インポートするインベントリが Sentinel のファイルサイズ上限を超えています。`],"Choose a finding in the current revision and enter a review note.":[`Elija un hallazgo de la revisión actual e introduzca una nota.`,`현재 리비전에서 발견 사항을 선택하고 검토 메모를 입력하세요.`,`请选择当前修订版本中的发现项并输入审查备注。`,`現在のリビジョンの検出事項を選び、レビューメモを入力してください。`],"Choose an incident in the current revision and enter a review note.":[`Elija un incidente de la revisión actual e introduzca una nota.`,`현재 리비전에서 인시던트를 선택하고 검토 메모를 입력하세요.`,`请选择当前修订版本中的事件并输入审查备注。`,`現在のリビジョンのインシデントを選び、レビューメモを入力してください。`],"Select a finding or incident in a retained evidence revision.":[`Seleccione un hallazgo o incidente de una revisión conservada.`,`보존된 증거 리비전에서 발견 사항 또는 인시던트를 선택하세요.`,`请选择已保留证据修订版本中的发现项或事件。`,`保持されている証拠リビジョンの検出事項かインシデントを選択してください。`],"That evidence revision is unavailable.":[`Esa revisión de evidencia no está disponible.`,`해당 증거 리비전을 사용할 수 없습니다.`,`该证据修订版本不可用。`,`その証拠リビジョンは利用できません。`],"Select an incident in a retained evidence revision.":[`Seleccione un incidente de una revisión conservada.`,`보존된 증거 리비전에서 인시던트를 선택하세요.`,`请选择已保留证据修订版本中的事件。`,`保持されている証拠リビジョンのインシデントを選択してください。`],"Select a retained evidence revision.":[`Seleccione una revisión de evidencia conservada.`,`보존된 증거 리비전을 선택하세요.`,`请选择已保留的证据修订版本。`,`保持されている証拠リビジョンを選択してください。`],"No full alert feed was saved for this evidence revision.":[`No se guardó la fuente completa de alertas para esta revisión.`,`이 증거 리비전에는 전체 경보 피드가 저장되지 않았습니다.`,`此证据修订版本未保存完整的告警源。`,`この証拠リビジョンには完全なアラートフィードが保存されていません。`],"Select a retained evidence revision and history page.":[`Seleccione una revisión conservada y una página del historial.`,`보존된 증거 리비전과 기록 페이지를 선택하세요.`,`请选择已保留的证据修订版本和历史记录页。`,`保持されている証拠リビジョンと履歴ページを選択してください。`],"Select a valid prior investigation.":[`Seleccione una investigación anterior válida.`,`유효한 이전 조사를 선택하세요.`,`请选择有效的先前调查。`,`有効な過去の調査を選択してください。`],"The prior investigation is no longer available in revision history.":[`La investigación anterior ya no está disponible en el historial.`,`이전 조사를 리비전 기록에서 더 이상 사용할 수 없습니다.`,`修订历史中已无法查看先前调查。`,`過去の調査はリビジョン履歴から利用できなくなりました。`],"That evidence revision is no longer retained.":[`Esa revisión de evidencia ya no se conserva.`,`해당 증거 리비전은 더 이상 보존되지 않습니다.`,`该证据修订版本已不再保留。`,`その証拠リビジョンは保持期間を過ぎています。`],"Select an earlier retained evidence revision for comparison.":[`Seleccione una revisión anterior conservada para compararla.`,`비교할 이전 증거 리비전을 선택하세요.`,`请选择一个较早且已保留的证据修订版本进行比较。`,`比較する以前の証拠リビジョンを選択してください。`],"The comparison revision is no longer retained.":[`La revisión de comparación ya no se conserva.`,`비교 리비전은 더 이상 보존되지 않습니다.`,`比较用的修订版本已不再保留。`,`比較対象のリビジョンは保持期間を過ぎています。`],"That alert is unavailable in the selected revision.":[`Esa alerta no está disponible en la revisión seleccionada.`,`선택한 리비전에서 해당 경보를 사용할 수 없습니다.`,`所选修订版本中没有该告警。`,`選択したリビジョンにそのアラートはありません。`],"No retained assessment to export.":[`No hay una evaluación conservada para exportar.`,`내보낼 보존된 평가가 없습니다.`,`没有可导出的已保留评估。`,`エクスポートできる保持済みの評価がありません。`],"Select a supported Markdown report language.":[`Seleccione un idioma compatible para el informe Markdown.`,`지원되는 Markdown 보고서 언어를 선택하세요.`,`请选择受支持的 Markdown 报告语言。`,`対応する Markdown レポートの言語を選択してください。`],"This revision has no evidence inventory to export.":[`Esta revisión no tiene un inventario de evidencia para exportar.`,`이 리비전에는 내보낼 증거 인벤토리가 없습니다.`,`此修订版本没有可导出的证据清单。`,`このリビジョンにはエクスポートできる証拠インベントリがありません。`],"Select an existing case to pause, resume, stop, or continue.":[`Seleccione un caso existente para pausarlo, reanudarlo, detenerlo o continuarlo.`,`일시 중지, 재개, 중지 또는 계속할 기존 사례를 선택하세요.`,`请选择要暂停、恢复、停止或继续的现有案件。`,`一時停止、再開、停止、または続行する既存のケースを選択してください。`],"That case has already changed state. Refresh the overview.":[`El estado del caso ya cambió. Actualice la vista general.`,`해당 사례의 상태가 이미 변경되었습니다. 개요를 새로 고치세요.`,`该案件状态已更改。请刷新概览。`,`ケースの状態はすでに変わっています。概要を更新してください。`],"Choose whether to refresh shared topology automatically.":[`Indique si quiere actualizar automáticamente la topología compartida.`,`공유 토폴로지 자동 새로 고침 여부를 선택하세요.`,`请选择是否自动刷新共享拓扑。`,`共有トポロジーを自動更新するか選択してください。`],"Could not synchronize shared relationships. Check the published inventories.":[`No se pudieron sincronizar las relaciones compartidas. Compruebe los inventarios publicados.`,`공유 관계를 동기화하지 못했습니다. 게시된 인벤토리를 확인하세요.`,`无法同步共享关系。请检查已发布的清单。`,`共有関係を同期できませんでした。公開されたインベントリを確認してください。`],"Choose a source snapshot.":[`Elija una instantánea de origen.`,`소스 스냅샷을 선택하세요.`,`请选择源快照。`,`ソーススナップショットを選択してください。`],"Choose a valid source snapshot.":[`Elija una instantánea de origen válida.`,`유효한 소스 스냅샷을 선택하세요.`,`请选择有效的源快照。`,`有効なソーススナップショットを選択してください。`],"The source snapshot is unavailable.":[`La instantánea de origen no está disponible.`,`소스 스냅샷을 사용할 수 없습니다.`,`源快照不可用。`,`ソーススナップショットは利用できません。`],"The asset is unavailable in the source snapshot.":[`El activo no está disponible en la instantánea de origen.`,`소스 스냅샷에서 자산을 사용할 수 없습니다.`,`源快照中没有该资产。`,`ソーススナップショットにその資産はありません。`],"Choose a shared asset and a valid relationship page.":[`Elija un activo compartido y una página de relaciones válida.`,`공유 자산과 유효한 관계 페이지를 선택하세요.`,`请选择共享资产和有效的关系页。`,`共有資産と有効な関係ページを選択してください。`],"Choose a valid reporting case.":[`Elija un caso de origen válido.`,`유효한 보고 사례를 선택하세요.`,`请选择有效的报告案件。`,`有効な報告元ケースを選択してください。`],"The asset is unavailable in the reporting case.":[`El activo no está disponible en el caso de origen.`,`보고 사례에서 자산을 사용할 수 없습니다.`,`报告案件中没有该资产。`,`報告元ケースにその資産はありません。`],"Enter a valid inventory search and page.":[`Introduzca una búsqueda y una página de inventario válidas.`,`유효한 인벤토리 검색어와 페이지를 입력하세요.`,`请输入有效的清单搜索词和页码。`,`有効なインベントリ検索語とページを入力してください。`],"The case changed. Refresh before assigning a task.":[`El caso cambió. Actualícelo antes de asignar una tarea.`,`사례가 변경되었습니다. 작업을 할당하기 전에 새로 고치세요.`,`案件已更改。请刷新后再分配任务。`,`ケースが変更されました。タスクを割り当てる前に更新してください。`],"Select a supported investigation and a graph node.":[`Seleccione una investigación compatible y un nodo del grafo.`,`지원되는 조사 및 그래프 노드를 선택하세요.`,`请选择受支持的调查和图谱节点。`,`対応する調査とグラフノードを選択してください。`],"That investigation is unavailable for the selected node or case scope.":[`Esa investigación no está disponible para el nodo o el alcance seleccionado.`,`선택한 노드 또는 사례 범위에서는 해당 조사를 사용할 수 없습니다.`,`所选节点或案件范围不支持该调查。`,`その調査は選択したノードまたはケースの範囲では利用できません。`],"The current plan has reached its investigation limit.":[`El plan actual alcanzó su límite de investigaciones.`,`현재 계획이 조사 한도에 도달했습니다.`,`当前计划已达到调查上限。`,`現在のプランは調査件数の上限に達しました。`],"The case changed. Refresh before changing a task.":[`El caso cambió. Actualícelo antes de modificar la tarea.`,`사례가 변경되었습니다. 작업을 변경하기 전에 새로 고치세요.`,`案件已更改。请刷新后再修改任务。`,`ケースが変更されました。タスクを変更する前に更新してください。`],"Select an investigation from the current task queue.":[`Seleccione una investigación de la cola de tareas actual.`,`현재 작업 대기열에서 조사를 선택하세요.`,`请从当前任务队列中选择调查。`,`現在のタスクキューから調査を選択してください。`],"This investigation is no longer eligible for that action.":[`Esa acción ya no está disponible para la investigación.`,`이 조사에는 더 이상 해당 작업을 수행할 수 없습니다.`,`此调查已无法执行该操作。`,`この調査ではその操作を実行できなくなりました。`],"A Sentinel assessment is already active":[`Ya hay una evaluación de Sentinel activa`,`Sentinel 평가가 이미 실행 중입니다`,`已有活动的 Sentinel 评估`,`Sentinel の評価はすでに実行中です`],"Sentinel could not process that request. Check the published assessment inputs.":[`Sentinel no pudo procesar la solicitud. Compruebe los datos publicados para la evaluación.`,`Sentinel이 요청을 처리하지 못했습니다. 게시된 평가 입력을 확인하세요.`,`Sentinel 无法处理此请求。请检查已发布的评估输入。`,`Sentinel
