name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the test build (e.g. v0.1.0-rc1)"
        required: false
        default: "v0.0.0-test"

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            output: triggerfish-linux-x64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            output: triggerfish-linux-arm64
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            output: triggerfish-macos-x64
            runner: macos-latest
          - target: aarch64-apple-darwin
            output: triggerfish-macos-arm64
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            output: triggerfish-windows-x64.exe
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Tidepool UI
        # --legacy-peer-deps matches pr-checks.yml. Without it npm fails on a
        # vite peer conflict from @sveltejs/vite-plugin-svelte, which breaks
        # every platform in the matrix and skips the release jobs.
        run: cd tidepool-ui && npm install --legacy-peer-deps && npm run build

      - name: Stamp version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "export const VERSION: string = \"${VERSION}\";" > src/cli/version.ts

      - name: Compile binary
        run: >
          deno compile --allow-all
          --target ${{ matrix.target }}
          --include config/
          --include src/skills/
          --include src/exec/sandbox/worker.ts
          --include src/tools/tidepool/dist/index.html
          --output=${{ matrix.output }}
          src/cli/main.ts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            output: triggerfish-tidepool-macos-arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            output: triggerfish-tidepool-macos-x64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            output: triggerfish-tidepool-linux-x64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            output: triggerfish-tidepool-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Tauri binary
        working-directory: tauri
        run: cargo build --release --target ${{ matrix.target }}

      - name: Copy binary to dist
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp tauri/target/${{ matrix.target }}/release/triggerfish-tidepool.exe dist/${{ matrix.output }}
          else
            cp tauri/target/${{ matrix.target }}/release/triggerfish-tidepool dist/${{ matrix.output }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    # Gated on both build sets: if either fails, no release is published.
    # Previously build-tauri.yml attached separately and would create a
    # release on its own, producing a partial one when this workflow failed.
    needs: [build-binaries, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;

      - name: Generate checksums
        run: |
          cd dist
          sha256sum triggerfish-linux-* triggerfish-macos-* \
            triggerfish-windows-* > SHA256SUMS.txt
          sha256sum triggerfish-tidepool-* > SHA256SUMS-tauri.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  build-docker:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage binaries for Docker build
        run: |
          mkdir -p docker-context
          cp artifacts/triggerfish-linux-x64/triggerfish-linux-x64 docker-context/triggerfish-linux-amd64
          cp artifacts/triggerfish-linux-arm64/triggerfish-linux-arm64 docker-context/triggerfish-linux-arm64
          cp deploy/docker/Dockerfile.release docker-context/Dockerfile

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          target: production
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: Build and push debug image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          target: debug
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}-debug
            ghcr.io/${{ github.repository }}:debug

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
