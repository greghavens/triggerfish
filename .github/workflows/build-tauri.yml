name: Build Tauri Native UI

# Standalone Tauri build for manual verification only. The release path
# lives in release.yml, which builds these same binaries and publishes them
# together with the CLI binaries in a single release. This workflow must not
# create or attach to a release: doing so is what produced partial releases
# when the CLI build failed but this one succeeded.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            output: triggerfish-tidepool-macos-arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            output: triggerfish-tidepool-macos-x64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            output: triggerfish-tidepool-linux-x64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            output: triggerfish-tidepool-windows-x64.exe

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf

      - name: Build Tauri binary
        working-directory: tauri
        run: cargo build --release --target ${{ matrix.target }}

      - name: Copy binary to dist
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp tauri/target/${{ matrix.target }}/release/triggerfish-tidepool.exe dist/${{ matrix.output }}
          else
            cp tauri/target/${{ matrix.target }}/release/triggerfish-tidepool dist/${{ matrix.output }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
